<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#195347" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0B2520" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#071815" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Sunburst Dial -->
    <radialGradient id="emeraldDial" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B6354"/>
      <stop offset="45%" stop-color="#0E3D34"/>
      <stop offset="85%" stop-color="#07221D"/>
      <stop offset="100%" stop-color="#041411"/>
    </radialGradient>

    <!-- Brushed Steel Bezel -->
    <linearGradient id="brushedBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#B0B8C0"/>
      <stop offset="35%" stop-color="#5A6570"/>
      <stop offset="50%" stop-color="#E2E7ED"/>
      <stop offset="70%" stop-color="#7A8794"/>
      <stop offset="85%" stop-color="#A5AFBA"/>
      <stop offset="100%" stop-color="#414B54"/>
    </linearGradient>

    <!-- Rose Gold / Champagne Accents -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF5E4"/>
      <stop offset="50%" stop-color="#DFC49D"/>
      <stop offset="100%" stop-color="#A88B60"/>
    </linearGradient>

    <!-- Aubergine Subdial -->
    <radialGradient id="aubergineSub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A1856"/>
      <stop offset="70%" stop-color="#230B2A"/>
      <stop offset="100%" stop-color="#120417"/>
    </radialGradient>

    <!-- Electric Lime Glow -->
    <filter id="limeNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="watchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#watchShadow)">
    <!-- STRAP TOP -->
    <path d="M 230 40 L 370 40 L 350 240 L 250 240 Z" fill="#0D1815" stroke="#1E3831" stroke-width="2"/>
    <!-- Top Strap Texture Stitching & Embossing -->
    <line x1="245" y1="45" x2="260" y2="230" stroke="#1D4B3E" stroke-dasharray="6 4" stroke-width="1.5"/>
    <line x1="355" y1="45" x2="340" y2="230" stroke="#1D4B3E" stroke-dasharray="6 4" stroke-width="1.5"/>
    <rect x="250" y="70" width="100" height="20" rx="3" fill="#11221D" opacity="0.6"/>
    <rect x="255" y="110" width="90" height="20" rx="3" fill="#11221D" opacity="0.6"/>
    <rect x="260" y="150" width="80" height="20" rx="3" fill="#11221D" opacity="0.6"/>

    <!-- STRAP BOTTOM -->
    <path d="M 250 560 L 350 560 L 370 760 L 230 760 Z" fill="#0D1815" stroke="#1E3831" stroke-width="2"/>
    <line x1="260" y1="570" x2="245" y2="750" stroke="#1D4B3E" stroke-dasharray="6 4" stroke-width="1.5"/>
    <line x1="340" y1="570" x2="355" y2="750" stroke="#1D4B3E" stroke-dasharray="6 4" stroke-width="1.5"/>
    <rect x="260" y="590" width="80" height="20" rx="3" fill="#11221D" opacity="0.6"/>
    <rect x="255" y="630" width="90" height="20" rx="3" fill="#11221D" opacity="0.6"/>
    <rect x="250" y="670" width="100" height="20" rx="3" fill="#11221D" opacity="0.6"/>

    <!-- WATCH CASE LUGS -->
    <polygon points="210,210 260,200 240,280 200,270" fill="url(#brushedBezel)"/>
    <polygon points="390,210 340,200 360,280 400,270" fill="url(#brushedBezel)"/>
    <polygon points="210,590 260,600 240,520 200,530" fill="url(#brushedBezel)"/>
    <polygon points="390,590 340,600 360,520 400,530" fill="url(#brushedBezel)"/>

    <!-- CROWN & PUSHERS -->
    <!-- Top Chrono Pusher -->
    <rect x="495" y="320" width="18" height="24" rx="3" fill="url(#brushedBezel)" stroke="#333" stroke-width="1"/>
    <!-- Master Crown -->
    <polygon points="500,375 520,380 520,420 500,425" fill="url(#champagneGold)" stroke="#222"/>
    <line x1="505" y1="380" x2="505" y2="420" stroke="#886E42" stroke-width="2"/>
    <line x1="512" y1="382" x2="512" y2="418" stroke="#886E42" stroke-width="2"/>
    <circle cx="520" cy="400" r="3" fill="#C6F126"/>
    <!-- Bottom Chrono Pusher -->
    <rect x="495" y="456" width="18" height="24" rx="3" fill="url(#brushedBezel)" stroke="#333" stroke-width="1"/>

    <!-- MAIN CASE OUTER -->
    <circle cx="300" cy="400" r="208" fill="#1B2228" stroke="#0E1317" stroke-width="2"/>
    <!-- BRUSHED BEZEL RING -->
    <circle cx="300" cy="400" r="198" fill="url(#brushedBezel)"/>
    <circle cx="300" cy="400" r="182" fill="#141B20" stroke="#0B0E10" stroke-width="1.5"/>

    <!-- 8 Luxury Bezel Screws -->
    <g fill="#CBD2D8" stroke="#48535D" stroke-width="1">
      <circle cx="300" cy="214" r="5"/><line x1="297" y1="214" x2="303" y2="214" stroke="#222"/>
      <circle cx="431" cy="269" r="5"/><line x1="428" y1="267" x2="434" y2="271" stroke="#222"/>
      <circle cx="486" cy="400" r="5"/><line x1="486" y1="397" x2="486" y2="403" stroke="#222"/>
      <circle cx="431" cy="531" r="5"/><line x1="428" y1="533" x2="434" y2="529" stroke="#222"/>
      <circle cx="300" cy="586" r="5"/><line x1="297" y1="586" x2="303" y2="586" stroke="#222"/>
      <circle cx="169" cy="531" r="5"/><line x1="166" y1="529" x2="172" y2="533" stroke="#222"/>
      <circle cx="114" cy="400" r="5"/><line x1="114" y1="397" x2="114" y2="403" stroke="#222"/>
      <circle cx="169" cy="269" r="5"/><line x1="166" y1="271" x2="172" y2="267" stroke="#222"/>
    </g>

    <!-- INNER TACHYMETER FLANGE -->
    <circle cx="300" cy="400" r="180" fill="#061210" stroke="#C6F126" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Tachymeter micro ticks -->
    <circle cx="300" cy="400" r="172" fill="none" stroke="#688078" stroke-width="6" stroke-dasharray="1 3"/>

    <!-- THE EMERALD SUNBURST DIAL -->
    <circle cx="300" cy="400" r="168" fill="url(#emeraldDial)"/>

    <!-- Guilloché Ray Pattern -->
    <g opacity="0.12" stroke="#FFF" stroke-width="0.8">
      <line x1="300" y1="400" x2="300" y2="232"/>
      <line x1="300" y1="400" x2="384" y2="254"/>
      <line x1="300" y1="400" x2="445" y2="315"/>
      <line x1="300" y1="400" x2="468" y2="400"/>
      <line x1="300" y1="400" x2="445" y2="485"/>
      <line x1="300" y1="400" x2="384" y2="546"/>
      <line x1="300" y1="400" x2="300" y2="568"/>
      <line x1="300" y1="400" x2="216" y2="546"/>
      <line x1="300" y1="400" x2="155" y2="485"/>
      <line x1="300" y1="400" x2="132" y2="400"/>
      <line x1="300" y1="400" x2="155" y2="315"/>
      <line x1="300" y1="400" x2="216" y2="254"/>
    </g>

    <!-- SUB-DIAL 1: 3 O'CLOCK (30-Minute Counter - Aubergine) -->
    <g transform="translate(380, 400)">
      <circle r="44" fill="url(#aubergineSub)" stroke="url(#champagneGold)" stroke-width="1.2"/>
      <circle r="40" fill="none" stroke="#895394" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="0" y="-24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">30</text>
      <text x="24" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">10</text>
      <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">20</text>
      <!-- Subdial hand pointing to 8 mins -->
      <line x1="0" y1="0" x2="18" y2="-12" stroke="#C6F126" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#FFF"/>
    </g>

    <!-- SUB-DIAL 2: 9 O'CLOCK (Small Seconds - Aubergine) -->
    <g transform="translate(220, 400)">
      <circle r="44" fill="url(#aubergineSub)" stroke="url(#champagneGold)" stroke-width="1.2"/>
      <circle r="40" fill="none" stroke="#895394" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="0" y="-24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">60</text>
      <text x="24" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">20</text>
      <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#E6D3EE" text-anchor="middle" font-weight="600">40</text>
      <line x1="0" y1="0" x2="-14" y2="16" stroke="#F4F0E6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#FFF"/>
    </g>

    <!-- TOURBILLON APERTURE AT 6 O'CLOCK -->
    <g transform="translate(300, 475)">
      <!-- Cutout shadow -->
      <circle r="46" fill="#050807" stroke="url(#champagneGold)" stroke-width="2"/>
      <!-- Inner skeleton bridge -->
      <line x1="-42" y1="0" x2="42" y2="0" stroke="url(#brushedBezel)" stroke-width="3"/>
      <circle r="28" fill="none" stroke="#C6F126" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="6 3"/>
      <!-- Three-arm tourbillon cage -->
      <polygon points="0,-22 5,-4 22,-8 8,4 16,20 0,9 -16,20 -8,4 -22,-8 -5,-4" fill="url(#champagneGold)" opacity="0.9"/>
      <!-- Balance wheel & ruby jewel -->
      <circle cx="0" cy="0" r="10" fill="#2A1B2E" stroke="#E5597A" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#C6F126" filter="url(#limeNeon)"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>

    <!-- BRAND WORDMARK AT 12 O'CLOCK -->
    <g transform="translate(300, 315)" text-anchor="middle">
      <text font-family="'Cinzel', 'Playfair Display', serif" font-size="19" font-weight="700" letter-spacing="7" fill="url(#champagneGold)">VÉLOR</text>
      <text y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" letter-spacing="3" fill="#A5C7BC">CHRONOMETRE</text>
      <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="500" letter-spacing="2" fill="#C6F126">FLYBACK TOURBILLON</text>
    </g>

    <!-- APPLIED HOUR INDICES (Facetted Champagne Gold with Super-LumiNova) -->
    <!-- 12 O'clock Dual Baton -->
    <rect x="296" y="240" width="3.5" height="24" rx="1" fill="url(#champagneGold)"/>
    <rect x="301.5" y="240" width="3.5" height="24" rx="1" fill="url(#champagneGold)"/>
    <rect x="297" y="242" width="1.5" height="20" fill="#C6F126" filter="url(#limeNeon)"/>
    <rect x="302.5" y="242" width="1.5" height="20" fill="#C6F126" filter="url(#limeNeon)"/>

    <!-- 1 O'clock -->
    <rect x="370" y="260" width="6" height="20" rx="1" transform="rotate(30, 373, 270)" fill="url(#champagneGold)"/>
    <!-- 2 O'clock -->
    <rect x="424" y="316" width="6" height="20" rx="1" transform="rotate(60, 427, 326)" fill="url(#champagneGold)"/>
    <!-- 4 O'clock -->
    <rect x="424" y="464" width="6" height="20" rx="1" transform="rotate(120, 427, 474)" fill="url(#champagneGold)"/>
    <!-- 5 O'clock -->
    <rect x="370" y="520" width="6" height="20" rx="1" transform="rotate(150, 373, 530)" fill="url(#champagneGold)"/>
    <!-- 7 O'clock -->
    <rect x="224" y="520" width="6" height="20" rx="1" transform="rotate(210, 227, 530)" fill="url(#champagneGold)"/>
    <!-- 8 O'clock -->
    <rect x="170" y="464" width="6" height="20" rx="1" transform="rotate(240, 173, 474)" fill="url(#champagneGold)"/>
    <!-- 10 O'clock -->
    <rect x="170" y="316" width="6" height="20" rx="1" transform="rotate(300, 173, 326)" fill="url(#champagneGold)"/>
    <!-- 11 O'clock -->
    <rect x="224" y="260" width="6" height="20" rx="1" transform="rotate(330, 227, 270)" fill="url(#champagneGold)"/>

    <!-- HANDS (10:10 Classic Luxury Presentation) -->
    <!-- Hour Hand pointing to 10:08 (approx 304 deg) -->
    <g transform="translate(300, 400) rotate(305)">
      <path d="M -5 15 L -4 -90 L 0 -105 L 4 -90 L 5 15 Z" fill="url(#champagneGold)" stroke="#3A2A1A" stroke-width="0.8"/>
      <!-- Super-LumiNova insert -->
      <polygon points="0,-100 -2.5,-85 2.5,-85" fill="#C6F126" filter="url(#limeNeon)"/>
      <rect x="-2" y="-80" width="4" height="60" rx="1" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Minute Hand pointing to 10 past (approx 62 deg) -->
    <g transform="translate(300, 400) rotate(62)">
      <path d="M -4 18 L -3 -135 L 0 -150 L 3 -135 L 4 18 Z" fill="url(#champagneGold)" stroke="#3A2A1A" stroke-width="0.8"/>
      <!-- Super-LumiNova insert -->
      <polygon points="0,-146 -2,-132 2,-132" fill="#C6F126" filter="url(#limeNeon)"/>
      <rect x="-1.5" y="-128" width="3" height="98" rx="1" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Central Canon Pinion -->
    <circle cx="300" cy="400" r="10" fill="url(#champagneGold)" stroke="#4A3B2A" stroke-width="1"/>
    <circle cx="300" cy="400" r="6" fill="#1B2228"/>

    <!-- Sweeping Chronograph Seconds Hand (Electric Lime) -->
    <g transform="translate(300, 400) rotate(220)" filter="url(#limeNeon)">
      <!-- Counterweight with VÉLOR monogram shape -->
      <circle cx="0" cy="35" r="7" fill="none" stroke="#C6F126" stroke-width="2"/>
      <line x1="0" y1="45" x2="0" y2="-165" stroke="#C6F126" stroke-width="2"/>
      <!-- Arrow tip -->
      <polygon points="0,-168 -3.5,-155 3.5,-155" fill="#C6F126"/>
      <circle cx="0" cy="0" r="3.5" fill="#C6F126"/>
    </g>

    <!-- SAPPHIRE CRYSTAL DOME REFLECTION -->
    <path d="M 180 280 C 230 250, 360 250, 420 285 C 370 270, 240 270, 180 280 Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M 150 360 C 145 420, 160 480, 185 520 C 170 470, 160 420, 165 370 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>
</svg>
