<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Steel & Anthracite Finishes -->
    <linearGradient id="brushedSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CCD3DA"/>
      <stop offset="50%" stop-color="#8E99A4"/>
      <stop offset="75%" stop-color="#E2E7EC"/>
      <stop offset="100%" stop-color="#606C78"/>
    </linearGradient>

    <!-- Brass / Gold Gears -->
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#FFCA28"/>
      <stop offset="80%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Skeleton Bridges (Plum & Gunmetal) -->
    <linearGradient id="skeletonBridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1136"/>
      <stop offset="50%" stop-color="#4A1856"/>
      <stop offset="100%" stop-color="#1B0A20"/>
    </linearGradient>

    <radialGradient id="glassAperture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1215" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040708" stop-opacity="1"/>
    </radialGradient>

    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#gearShadow)">
    <!-- ALLIGATOR LEATHER STRAP (Top) -->
    <path d="M 205,35 L 295,35 L 280,150 L 220,150 Z" fill="#141C1A" stroke="#253531" stroke-width="1.5"/>
    <line x1="210" y1="50" x2="225" y2="140" stroke="#3D5A53" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="290" y1="50" x2="275" y2="140" stroke="#3D5A53" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="220" y="60" width="60" height="15" rx="3" fill="#1B2623"/>
    <rect x="225" y="90" width="50" height="15" rx="3" fill="#1B2623"/>

    <!-- ALLIGATOR LEATHER STRAP (Bottom) -->
    <path d="M 220,350 L 280,350 L 295,465 L 205,465 Z" fill="#141C1A" stroke="#253531" stroke-width="1.5"/>
    <line x1="225" y1="360" x2="210" y2="450" stroke="#3D5A53" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="275" y1="360" x2="290" y2="450" stroke="#3D5A53" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="225" y="380" width="50" height="15" rx="3" fill="#1B2623"/>
    <rect x="220" y="415" width="60" height="15" rx="3" fill="#1B2623"/>

    <!-- CASE LUGS -->
    <polygon points="190,140 230,130 215,195 180,185" fill="url(#brushedSteel)"/>
    <polygon points="310,140 270,130 285,195 320,185" fill="url(#brushedSteel)"/>
    <polygon points="190,360 230,370 215,305 180,315" fill="url(#brushedSteel)"/>
    <polygon points="310,360 270,370 285,305 320,315" fill="url(#brushedSteel)"/>

    <!-- CHRONO / MASTER CROWN -->
    <rect x="372" y="238" width="16" height="24" rx="2" fill="url(#brushedSteel)" stroke="#222" stroke-width="1"/>
    <line x1="376" y1="240" x2="376" y2="260" stroke="#333"/>
    <line x1="382" y1="240" x2="382" y2="260" stroke="#333"/>

    <!-- OUTER STEEL CASE & BEZEL -->
    <circle cx="250" cy="250" r="126" fill="#1F282E" stroke="#0E1317" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="120" fill="url(#brushedSteel)"/>
    <circle cx="250" cy="250" r="108" fill="#11171A"/>

    <!-- 6 BEZEL HEXAGONAL SCREWS -->
    <circle cx="250" cy="136" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>
    <circle cx="348" cy="193" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>
    <circle cx="348" cy="307" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>
    <circle cx="250" cy="364" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>
    <circle cx="152" cy="307" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>
    <circle cx="152" cy="193" r="3.5" fill="#CCD3DA" stroke="#333" stroke-width="0.8"/>

    <!-- TRANSPARENT SKELETON DIAL APERTURE -->
    <circle cx="250" cy="250" r="102" fill="url(#glassAperture)"/>

    <!-- EXPOSED MECHANICAL SKELETON GEARS & WHEELS -->
    
    <!-- Large Mainspring Barrel Gear (Top Right) -->
    <g transform="translate(295, 205)">
      <circle r="44" fill="none" stroke="url(#gearGold)" stroke-width="4" stroke-dasharray="4 2"/>
      <circle r="40" fill="#1F1508" stroke="url(#gearGold)" stroke-width="1.5"/>
      <circle r="26" fill="none" stroke="url(#gearGold)" stroke-width="1.2"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="url(#gearGold)" stroke-width="2"/>
      <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#gearGold)" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#E91E63" stroke="#880E4F" stroke-width="1.2"/> <!-- Ruby Jewel -->
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Center Escapement Intermediate Wheel (Center Left) -->
    <g transform="translate(205, 245)">
      <circle r="36" fill="none" stroke="url(#gearGold)" stroke-width="3" stroke-dasharray="3 2"/>
      <circle r="32" fill="#131C1A" stroke="url(#brushedSteel)" stroke-width="1.2"/>
      <circle r="18" fill="none" stroke="url(#brushedSteel)" stroke-width="1"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="url(#brushedSteel)" stroke-width="1.5"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#brushedSteel)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#E91E63" stroke="#880E4F" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#FFF"/>
    </g>

    <!-- Escapement Wheel (Bottom Center) -->
    <g transform="translate(250, 305)">
      <circle r="30" fill="none" stroke="url(#gearGold)" stroke-width="3.5" stroke-dasharray="5 3"/>
      <circle r="26" fill="#190F1C" stroke="url(#gearGold)" stroke-width="1.2"/>
      <!-- Balance Wheel Spirals -->
      <path d="M -16,0 A 16,16 0 1,1 16,0" fill="none" stroke="#D4A762" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#E91E63" stroke="#C2185B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- ARCHITECTURAL SKELETON BRIDGES (Openworked structure) -->
    <path d="M 180,180 Q 250,215 320,180 L 330,195 Q 250,235 170,195 Z" fill="url(#skeletonBridge)" stroke="#6A207A" stroke-width="1"/>
    <path d="M 235,160 L 265,160 L 255,335 L 245,335 Z" fill="url(#skeletonBridge)" stroke="#6A207A" stroke-width="1" opacity="0.85"/>
    <circle cx="250" cy="250" r="14" fill="#0E0512" stroke="#6A207A" stroke-width="1.5"/>

    <!-- OUTER CHAPTER RING (Seconds & Hour Markers) -->
    <circle cx="250" cy="250" r="100" fill="none" stroke="url(#brushedSteel)" stroke-width="8"/>
    <circle cx="250" cy="250" r="96" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="1 4"/>

    <!-- 12 APPLIED STEEL HOUR BATONS -->
    <rect x="247.5" y="152" width="5" height="14" rx="1" fill="#FFFFFF" stroke="#333" stroke-width="0.5"/>
    <rect x="340" y="247.5" width="14" height="5" rx="1" fill="#FFFFFF" stroke="#333" stroke-width="0.5"/>
    <rect x="247.5" y="334" width="5" height="14" rx="1" fill="#FFFFFF" stroke="#333" stroke-width="0.5"/>
    <rect x="146" y="247.5" width="14" height="5" rx="1" fill="#FFFFFF" stroke="#333" stroke-width="0.5"/>

    <!-- BRAND INSCRIPTION ON SAPPHIRE -->
    <rect x="210" y="172" width="80" height="20" rx="3" fill="#0A0E12" opacity="0.85"/>
    <text x="250" y="184" font-family="'Cinzel', serif" font-size="9" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">VÉLOR</text>
    <text x="250" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="4" font-weight="600" letter-spacing="1" fill="#D4A762" text-anchor="middle">SKELETON AUTOMATIC</text>

    <!-- BLUE STEEL / LUMINOUS SKELETON HANDS (10:10 Classic Setting) -->
    <!-- Hour Hand -->
    <g transform="translate(250, 250) rotate(305)">
      <path d="M -4,12 L -3,-60 L 0,-70 L 3,-60 L 4,12 Z" fill="#2E4A62" stroke="#162A3B" stroke-width="0.8"/>
      <rect x="-1.5" y="-55" width="3" height="42" fill="#80D8FF"/>
    </g>

    <!-- Minute Hand -->
    <g transform="translate(250, 250) rotate(65)">
      <path d="M -3.5,14 L -2.5,-88 L 0,-98 L 2.5,-88 L 3.5,14 Z" fill="#2E4A62" stroke="#162A3B" stroke-width="0.8"/>
      <rect x="-1.2" y="-80" width="2.4" height="65" fill="#80D8FF"/>
    </g>

    <!-- Center Pinion -->
    <circle cx="250" cy="250" r="7" fill="url(#brushedSteel)" stroke="#162A3B" stroke-width="1"/>
    <circle cx="250" cy="250" r="3" fill="#E91E63"/>

    <!-- Sweeping Red Seconds Hand -->
    <g transform="translate(250, 250) rotate(210)">
      <circle cx="0" cy="24" r="3.5" fill="#E53935"/>
      <line x1="0" y1="30" x2="0" y2="-102" stroke="#E53935" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Sapphire Reflection Angle -->
    <path d="M 175,185 C 220,155 300,155 335,185 C 290,172 220,172 175,185 Z" fill="#FFFFFF" opacity="0.22"/>
  </g>
</svg>
