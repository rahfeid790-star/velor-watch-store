<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cognac Alligator Leather -->
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="25%" stop-color="#7B4222"/>
      <stop offset="50%" stop-color="#9C552E"/>
      <stop offset="75%" stop-color="#7B4222"/>
      <stop offset="100%" stop-color="#3D1E0D"/>
    </linearGradient>

    <!-- Polished Dress Watch Steel -->
    <linearGradient id="dressSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#D8DEE4"/>
      <stop offset="45%" stop-color="#9EABB6"/>
      <stop offset="70%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#6B7884"/>
    </linearGradient>

    <!-- Eggshell Ivory Sunray Dial -->
    <radialGradient id="ivoryDial" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#EBE4D5"/>
    </radialGradient>

    <!-- Blued Steel Hands -->
    <linearGradient id="bluedSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2164A6"/>
      <stop offset="50%" stop-color="#144275"/>
      <stop offset="100%" stop-color="#092344"/>
    </linearGradient>

    <filter id="leatherShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#leatherShadow)">
    <!-- TOP LEATHER STRAP -->
    <path d="M 205,35 L 295,35 L 282,150 L 218,150 Z" fill="url(#leatherStrap)" stroke="#3D1E0D" stroke-width="1.5"/>
    <!-- Saddle Stitching -->
    <line x1="211" y1="42" x2="223" y2="145" stroke="#E6D3B3" stroke-width="1.4" stroke-dasharray="5 3"/>
    <line x1="289" y1="42" x2="277" y2="145" stroke="#E6D3B3" stroke-width="1.4" stroke-dasharray="5 3"/>
    <!-- Leather Grain Creases -->
    <path d="M 224,70 Q 250,75 276,70" stroke="#3D1E0D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 222,105 Q 250,110 278,105" stroke="#3D1E0D" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- BOTTOM LEATHER STRAP -->
    <path d="M 218,350 L 282,350 L 295,465 L 205,465 Z" fill="url(#leatherStrap)" stroke="#3D1E0D" stroke-width="1.5"/>
    <line x1="223" y1="355" x2="211" y2="458" stroke="#E6D3B3" stroke-width="1.4" stroke-dasharray="5 3"/>
    <line x1="277" y1="355" x2="289" y2="458" stroke="#E6D3B3" stroke-width="1.4" stroke-dasharray="5 3"/>
    <path d="M 224,385 Q 250,390 276,385" stroke="#3D1E0D" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 222,420 Q 250,425 278,420" stroke="#3D1E0D" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Adjustment Holes -->
    <circle cx="250" cy="385" r="3" fill="#241107"/>
    <circle cx="250" cy="415" r="3" fill="#241107"/>
    <circle cx="250" cy="445" r="3" fill="#241107"/>

    <!-- CURVED LUGS -->
    <polygon points="190,140 230,132 216,196 178,186" fill="url(#dressSteel)"/>
    <polygon points="310,140 270,132 284,196 322,186" fill="url(#dressSteel)"/>
    <polygon points="190,360 230,368 216,304 178,314" fill="url(#dressSteel)"/>
    <polygon points="310,360 270,368 284,304 322,314" fill="url(#dressSteel)"/>

    <!-- DRESS CROWN AT 3 O'CLOCK -->
    <polygon points="378,240 392,243 392,257 378,260" fill="url(#dressSteel)" stroke="#444" stroke-width="1"/>
    <circle cx="391" cy="250" r="3" fill="#092344"/>

    <!-- CASE & STEPPED BEZEL -->
    <circle cx="250" cy="250" r="128" fill="#1A2228" stroke="#0D1216" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="122" fill="url(#dressSteel)"/>
    <circle cx="250" cy="250" r="114" fill="#C5CED6"/>
    <circle cx="250" cy="250" r="110" fill="url(#dressSteel)"/>

    <!-- SUNRAY IVORY DIAL -->
    <circle cx="250" cy="250" r="106" fill="url(#ivoryDial)"/>

    <!-- Subtle Dial Texture & Minutes Track -->
    <circle cx="250" cy="250" r="99" fill="none" stroke="#A89F8F" stroke-width="1"/>
    <circle cx="250" cy="250" r="96" fill="none" stroke="#7A7060" stroke-width="0.8" stroke-dasharray="1 3"/>

    <!-- 12 ROMAN NUMERALS & BATONS -->
    <text x="250" y="172" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#22201D" text-anchor="middle">XII</text>
    <text x="328" y="256" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#22201D" text-anchor="middle">III</text>
    <text x="250" y="336" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#22201D" text-anchor="middle">VI</text>
    <text x="172" y="256" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#22201D" text-anchor="middle">IX</text>

    <!-- Sub-dial at 6 o'clock (Small Seconds complication) -->
    <g transform="translate(250, 296)">
      <circle r="22" fill="#F4EFE6" stroke="#C4B9A7" stroke-width="0.8"/>
      <circle r="19" fill="none" stroke="#7A7060" stroke-width="0.5" stroke-dasharray="1 2.5"/>
      <text x="0" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" fill="#7A7060" text-anchor="middle">60</text>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" fill="#7A7060" text-anchor="middle">30</text>
      <!-- Small Seconds Hand -->
      <line x1="0" y1="4" x2="0" y2="-15" stroke="url(#bluedSteel)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2" fill="#092344"/>
    </g>

    <!-- BRAND INSCRIPTION -->
    <text x="250" y="206" font-family="'Cinzel', serif" font-size="13" font-weight="700" letter-spacing="4" fill="#1C262C" text-anchor="middle">VÉLOR</text>
    <text x="250" y="217" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" letter-spacing="1.5" fill="#8B7355" text-anchor="middle">CHRONOMÈTRE OFFICIEL</text>

    <!-- BLUED STEEL LEAF HANDS (Set at 10:10) -->
    <!-- Hour Hand -->
    <g transform="translate(250, 250) rotate(305)">
      <path d="M 0,8 C -3,2 -5,-25 0,-62 C 5,-25 3,2 0,8 Z" fill="url(#bluedSteel)"/>
      <line x1="0" y1="5" x2="0" y2="-55" stroke="#79B5EC" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Minute Hand -->
    <g transform="translate(250, 250) rotate(58)">
      <path d="M 0,10 C -3.5,4 -4.5,-40 0,-88 C 4.5,-40 3.5,4 0,10 Z" fill="url(#bluedSteel)"/>
      <line x1="0" y1="6" x2="0" y2="-80" stroke="#79B5EC" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Polished Center Pinion Cap -->
    <circle cx="250" cy="250" r="5.5" fill="url(#dressSteel)" stroke="#092344" stroke-width="0.8"/>
    <circle cx="250" cy="250" r="2" fill="#FFFFFF"/>

    <!-- SAPPHIRE CRYSTAL REFLECTION -->
    <path d="M 172,175 C 220,140 305,140 338,175 C 290,160 215,160 172,175 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

