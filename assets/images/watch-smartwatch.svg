<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Matte Black Case & Silicone -->
    <linearGradient id="smartCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="40%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Vibrant OLED Digital Glow -->
    <linearGradient id="oledDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SMARTWATCH SILICONE BAND -->
  <path d="M 215,35 L 285,35 L 280,155 L 220,155 Z" fill="#263238" stroke="#1C2327" stroke-width="1.5"/>
  <circle cx="250" cy="70" r="4" fill="#1C2327"/>
  <circle cx="250" cy="100" r="4" fill="#1C2327"/>
  <circle cx="250" cy="130" r="4" fill="#1C2327"/>

  <path d="M 220,345 L 280,345 L 285,465 L 215,465 Z" fill="#263238" stroke="#1C2327" stroke-width="1.5"/>
  <rect x="235" y="380" width="30" height="15" rx="3" fill="#1C2327"/>

  <!-- WATCH CASE (Curved Squircle/Round Smartwatch) -->
  <rect x="160" y="150" width="180" height="200" rx="42" fill="url(#smartCase)" stroke="#455A64" stroke-width="1.5"/>
  <!-- Digital Crown on right -->
  <rect x="340" y="200" width="10" height="30" rx="3" fill="#455A64" stroke="#212121"/>
  <!-- Action Button on right -->
  <rect x="340" y="270" width="8" height="24" rx="2" fill="#37474F"/>

  <!-- OLED TOUCH DISPLAY -->
  <rect x="175" y="165" width="150" height="170" rx="30" fill="url(#oledDisplay)"/>

  <!-- ACTIVE SMART UI SCREEN -->
  <!-- Digital Clock 10:09 -->
  <text x="250" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">10:09</text>
  <text x="250" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#90A4AE" text-anchor="middle">WED, OCT 28</text>

  <!-- Health & Activity Rings -->
  <g transform="translate(250, 280)">
    <!-- Heart Rate -->
    <path d="M -40,0 L -30,0 L -25,-8 L -18,10 L -12,-12 L -6,6 L 0,0 L 40,0" fill="none" stroke="#FF1744" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="url(#neonGreen)" text-anchor="middle" filter="url(#screenGlow)">72 BPM • 8,420 STEPS</text>
  </g>

  <!-- Battery & Status at Top -->
  <circle cx="215" cy="188" r="3" fill="#00E676"/>
  <text x="226" y="191" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#ECEFF1">94%</text>
  <path d="M 275,188 L 285,188 M 280,183 L 280,193" stroke="#00B0FF" stroke-width="1.5"/>
</svg>
