<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="diverSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#C5CCD4"/>
      <stop offset="50%" stop-color="#838E99"/>
      <stop offset="70%" stop-color="#DDE2E6"/>
      <stop offset="100%" stop-color="#55606A"/>
    </linearGradient>
    <radialGradient id="blackDial" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E262B"/>
      <stop offset="70%" stop-color="#0E1317"/>
      <stop offset="100%" stop-color="#050708"/>
    </radialGradient>
    <filter id="diverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#diverShadow)">
    <!-- Steel Bracelet -->
    <path d="M 210,40 L 290,40 L 280,160 L 220,160 Z" fill="url(#diverSteel)" stroke="#4A5560" stroke-width="1.2"/>
    <line x1="213" y1="75" x2="287" y2="75" stroke="#4A5560" stroke-width="1.5"/>
    <line x1="216" y1="110" x2="284" y2="110" stroke="#4A5560" stroke-width="1.5"/>
    <rect x="238" y="40" width="24" height="120" fill="#FFFFFF" opacity="0.25"/>

    <path d="M 220,340 L 280,340 L 290,460 L 210,460 Z" fill="url(#diverSteel)" stroke="#4A5560" stroke-width="1.2"/>
    <line x1="218" y1="375" x2="282" y2="375" stroke="#4A5560" stroke-width="1.5"/>
    <line x1="216" y1="410" x2="284" y2="410" stroke="#4A5560" stroke-width="1.5"/>
    <rect x="238" y="340" width="24" height="120" fill="#FFFFFF" opacity="0.25"/>

    <!-- Lugs -->
    <polygon points="190,145 230,135 215,200 180,190" fill="url(#diverSteel)"/>
    <polygon points="310,145 270,135 285,200 320,190" fill="url(#diverSteel)"/>
    <polygon points="190,355 230,365 215,300 180,310" fill="url(#diverSteel)"/>
    <polygon points="310,355 270,365 285,300 320,310" fill="url(#diverSteel)"/>

    <!-- Screw-down Crown with Crown Guards -->
    <path d="M 365,225 L 382,238 L 382,262 L 365,275 Z" fill="url(#diverSteel)"/>
    <rect x="378" y="240" width="10" height="20" rx="1" fill="url(#diverSteel)" stroke="#222"/>

    <!-- Case -->
    <circle cx="250" cy="250" r="126" fill="url(#diverSteel)" stroke="#222" stroke-width="1.5"/>
    <!-- Black Ceramic 60-Minute Diver Bezel -->
    <circle cx="250" cy="250" r="118" fill="#0C1317" stroke="#37474F" stroke-width="2"/>
    <circle cx="250" cy="250" r="114" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="2 6"/>
    <!-- Luminescent Pip at 12 o'clock -->
    <polygon points="250,134 244,144 256,144" fill="#69F0AE"/>
    <circle cx="250" cy="141" r="2.5" fill="#FFFFFF"/>

    <!-- Numbers on Bezel: 10, 20, 30, 40, 50 -->
    <text x="328" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
    <text x="345" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text>
    <text x="250" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">30</text>
    <text x="155" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">40</text>
    <text x="172" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">50</text>

    <!-- Inner Flange & Dial -->
    <circle cx="250" cy="250" r="98" fill="url(#diverSteel)"/>
    <circle cx="250" cy="250" r="94" fill="url(#blackDial)"/>

    <!-- Dial Text -->
    <text x="250" y="205" font-family="'Cinzel', serif" font-size="11" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SEIKO</text>
    <text x="250" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" letter-spacing="1" fill="#90A4AE" text-anchor="middle">AUTOMATIC DIVER'S</text>
    <text x="250" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="600" letter-spacing="1" fill="#E53935" text-anchor="middle">200m / 660ft</text>

    <!-- Super-LumiNova Round & Inverted Triangle Markers -->
    <polygon points="250,165 242,178 258,178" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="295" cy="177" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="323" cy="205" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <!-- Date window at 3 o'clock -->
    <rect x="315" y="242" width="16" height="16" rx="1" fill="#FFF" stroke="#222"/>
    <text x="323" y="254" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">28</text>
    <circle cx="323" cy="295" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="295" cy="323" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <rect x="246" y="323" width="8" height="12" rx="1" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="205" cy="323" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="177" cy="295" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <rect x="165" y="246" width="12" height="8" rx="1" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="177" cy="205" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>
    <circle cx="205" cy="177" r="5" fill="#69F0AE" stroke="#FFF" stroke-width="1"/>

    <!-- Broad Arrow Diver Hands -->
    <g transform="translate(250, 250) rotate(305)">
      <path d="M -4,10 L -3,-55 L -8,-58 L 0,-70 L 8,-58 L 3,-55 L 4,10 Z" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
      <polygon points="0,-64 -4,-55 4,-55" fill="#69F0AE"/>
    </g>
    <g transform="translate(250, 250) rotate(60)">
      <path d="M -3,12 L -2.5,-85 L 0,-94 L 2.5,-85 L 3,12 Z" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
      <rect x="-1.5" y="-80" width="3" height="60" fill="#69F0AE"/>
    </g>
    <circle cx="250" cy="250" r="6" fill="#37474F"/>
    <circle cx="250" cy="250" r="3" fill="#FFFFFF"/>
    <!-- Seconds hand with lollipop lume circle -->
    <g transform="translate(250, 250) rotate(210)">
      <circle cx="0" cy="50" r="4.5" fill="#69F0AE" stroke="#37474F" stroke-width="0.8"/>
      <line x1="0" y1="58" x2="0" y2="-96" stroke="#E53935" stroke-width="1.2"/>
    </g>
  </g>
</svg>
